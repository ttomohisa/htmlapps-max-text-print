name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "max-text-print.html"
      - "app.config.json"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "schemas/dependencies*.json"
      - ".github/workflows/dependency-updates.yml"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

      - name: Install browser-only QA dependencies
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0 pdf-lib@1.17.1
          npx playwright install chromium

      - name: Verify real layout and PDF output
        shell: pwsh
        run: node tests/browser-print.cjs

      - name: Upload browser and PDF evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: print-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
